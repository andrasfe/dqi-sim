[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dqisim"
version = "0.1.0"
description = "Decoder-in-the-loop simulator for Decoded Quantum Interferometry (DQI) variants: CLI + local web UI, resource-safe"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "numba>=0.59", "psutil>=5.9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
dqisim = "dqisim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dqisim = ["ui/*.html", "presets/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
